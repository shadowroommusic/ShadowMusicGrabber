name: Release

# 推 tag（v1.7.1 这种）自动构建 Windows exe 并创建 Release。
# 也可以在 Actions 页面手动运行（勾选 dry_run 只构建、不发布）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建，不创建 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          # choco 改的是机器级 PATH，当前会话要重新读取一次
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          ffmpeg -version | Select-Object -First 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Check APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import re; src=open('main.py', encoding='utf-8').read(); print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', src).group(1))"
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version.Trim() -ne $tag) {
            Write-Error "main.py 的 APP_VERSION($version) 与 tag($tag) 不一致，先改版本号再打 tag"
            exit 1
          }
          Write-Output "version ok: $version"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean ShadowMusicGrabber.spec

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Create release with the exe
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist\ShadowMusicGrabber.exe" `
            --title "Shadow MusicGrabber ${{ github.ref_name }}" `
            --generate-notes

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusicGrabber-${{ github.ref_name || 'build' }}
          path: dist/ShadowMusicGrabber.exe
          if-no-files-found: error

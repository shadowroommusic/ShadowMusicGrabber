name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # requires-python >=3.9:守住下限。3.9 已 EOL,ubuntu-latest(26.04)
          # 的 setup-python 不再提供,固定到仍有 3.9 构建的 22.04。
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: choco install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests (linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests -q

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest tests -q

  build:
    name: build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: .exe
          - os: macos-latest
            platform: macos-arm64
            ext: .zip
          - os: macos-13
            platform: macos-x64
            ext: .zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Export version
        shell: bash
        run: |
          V=$(python -c "import _version; print(_version.__version__)")
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean ShadowMusicGrabber.spec

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv "dist/ShadowMusicGrabber.exe" "dist/ShadowMusicGrabber-${VERSION}-windows-x64.exe"

      - name: Package artifact (macos)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/ShadowMusicGrabber
          cd dist && zip -q "ShadowMusicGrabber-${VERSION}-${{ matrix.platform }}.zip" ShadowMusicGrabber

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowMusicGrabber-${{ env.VERSION }}-${{ matrix.platform }}
          path: |
            dist/ShadowMusicGrabber-*${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ShadowMusicGrabber-*

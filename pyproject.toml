[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-musicgrabber"
dynamic = ["version"]
description = "Shadow MusicGrabber MCP server: audio probe, NCM / QQ Music decrypt, transcode, download"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "music", "ncm", "qmc", "flac", "yt-dlp"]
# 版本号单一来源: _version.py(main.py / mcp_server.py 同样引用它)。
dependencies = [
    "yt-dlp>=2024.1.1",
    "mutagen>=1.47.0",
    "pycryptodome>=3.20",
    "requests>=2.31",
]

[project.optional-dependencies]
# 桌面版才需要（GUI）：core 只留 MCP 运行时需要的三个 + requests
gui = [
    "customtkinter>=5.2",
    "tkinterdnd2>=0.3",
    "pillow>=10",
    "plyer>=2.1",
]


[project.scripts]
shadow-musicgrabber-mcp = "mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.setuptools]
py-modules = [
    "_version",
    "mcp_server",
    "converter",
    "downloader",
    "ncm_decrypt",
    "qmc_decrypt",
]
